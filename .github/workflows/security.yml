name: LinkHub v2 Security & Build Verification

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-and-build:
    name: Typecheck, Security Tests, Rules Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint Firestore security rules
        run: npm run lint:rules

      - name: Run cryptography, migration, SSRF & API security test suites
        run: npm test

      - name: Run Firestore Emulator rules test suite
        run: |
          npm i -g firebase-tools
          firebase emulators:exec --only firestore --project linkhub-test "npm run test:emulator"

      - name: Production Vite build
        run: npm run build
