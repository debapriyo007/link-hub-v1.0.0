<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Obsidian Rounded Tile matching LinkHub Identity -->
  <rect width="64" height="64" rx="16" fill="#0B0B0E"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FF9000" stroke-opacity="0.35" stroke-width="2.5"/>

  <!-- Signature "Link" Wordmark -->
  <text
    x="32"
    y="26.5"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="800"
    letter-spacing="-0.6"
  >Link</text>

  <!-- Signature Orange "[hub]" Pill Badge -->
  <rect x="9" y="31.5" width="46" height="23" rx="6.5" fill="#FF9000"/>
  <text
    x="32"
    y="48"
    text-anchor="middle"
    fill="#0B0B0E"
    font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
    font-size="18.5"
    font-weight="800"
    letter-spacing="-0.4"
  >hub</text>
</svg>
